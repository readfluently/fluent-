<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fluent | Grade 10–12</title>

<style>
:root{
  --bg:#f3f4f8;
  --surface:#ffffff;
  --text:#23364d;
  --muted:#667085;
  --line:#dbe3ee;
  --shadow:0 10px 24px rgba(15,23,42,0.06);
  --shadow-hover:0 14px 28px rgba(15,23,42,0.10);

  /* GREEN THEME */
  --phase-tint:linear-gradient(180deg,#ecfdf5,#ffffff);
  --phase-active-bg:#d1fae5;
  --phase-active-text:#059669;
  --phase-focus:rgba(5,150,105,0.12);

  --blue-card:#eef3ff;
  --green-card:#edf8f1;
  --purple-card:#f3efff;
  --gold-card:#fff6df;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* 🚫 NO UNDERLINES */
a, a:visited, a:hover, a:active, a:focus{
  text-decoration:none !important;
  color:inherit;
}

/* HEADER */
.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:var(--phase-tint);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}

.nav-shell{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 18px;
  flex-wrap:wrap;
}

.brand-logo{
  width:76px;
  height:76px;
}

.brand-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.nav-main{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.nav-link{
  padding:12px 18px;
  border-radius:14px;
  font-weight:700;
}

.nav-link.active{
  background:var(--phase-active-bg);
  color:var(--phase-active-text);
}

/* SEARCH */
.nav-search{
  display:flex;
  gap:8px;
}

.nav-search input{
  height:42px;
  border-radius:10px;
  border:1px solid var(--line);
  padding:0 10px;
}

.nav-search button{
  background:#059669;
  color:white;
  border:none;
  border-radius:10px;
  padding:0 16px;
}

/* PAGE */
.page{
  max-width:1100px;
  margin:auto;
  padding:22px 16px 48px;

/* HERO */
.hero{
  background:#fff;
  border-radius:30px;
  padding:24px;
  margin-bottom:22px;
}

.hero h1{margin:0 0 10px;}
.hero p{color:var(--muted);}

/* CARDS */
.section-card{
  background:#fff;
  border-radius:30px;
  padding:22px;
  margin-bottom:22px;
}

.section-title{
  margin-bottom:20px;
  font-weight:800;
}

.feature-list{
  display:grid;
  gap:18px;
}

.feature-item{
  display:block;
  border-radius:22px;
  padding:22px;
}

.blue-card{background:var(--blue-card);}
.green-card{background:var(--green-card);}
.purple-card{background:var(--purple-card);}
.gold-card{background:var(--gold-card);}

.subject-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:18px;
}

.subject-box{
  background:#fff;
  padding:16px;
  border-radius:18px;
}

.footer-note{
  text-align:center;
  color:var(--muted);
}
</style>
</head>

<body>

<header class="site-header">
  <div class="nav-shell">

    <a href="../index.html">
      <div class="brand-logo">
        <img src="../shared/logos/fluent-logo.png">
      </div>
    </a>

    <nav class="nav-main">
      <a class="nav-link" href="../index.html">Home</a>
      <a class="nav-link" href="./grade-r-3.html">Grade R–3</a>
      <a class="nav-link" href="./grade-4-6.html">Grade 4–6</a>
      <a class="nav-link" href="./grade-7-9.html">Grade 7–9</a>
      <a class="nav-link active" href="./grade-10-12.html">Grade 10–12</a>
      <a class="nav-link" href="./teachers.html">Teachers</a>
    </nav>

    <form class="nav-search" id="navSearchForm">
      <input id="navSearchInput" placeholder="library">
      <button>Search</button>
    </form>

  </div>
</header>

<main class="page">


<section class="hero">
  <h1>Grade 10–12</h1>
  <p>Advanced reading, subject-linked texts, oral preparation, and academic confidence.</p>
</section>

<section class="section-card">
  <h2 class="section-title">Reading</h2>

  <div class="feature-list">
    <a class="feature-item blue-card" href="./grade-10-12-library.html">Library</a>
    <a class="feature-item green-card" href="../library/read-fluently-fet.html">Read Fluently</a>
    <a class="feature-item purple-card" href="./grade-10-12-library.html#digital-literacy">Digital Literacy</a>
  </div>
</section>

<section class="section-card">
  <h2 class="section-title">Learner Activities</h2>

  <div class="feature-list">
    <a class="feature-item green-card" href="../interactive-posters/index.html">Interactive Posters</a>
    <a class="feature-item purple-card" href="../play-learn/index.html">Thinking Activities</a>
    <a class="feature-item gold-card" href="../writing-tools/index.html">Writing Tools</a>
  </div>
</section>

<p class="footer-note">Fluent FET Phase</p>

</main>

<script>
function goBack(){
  if(history.length>1){history.back();}
  else{window.location.href="../index.html";}
}

document.addEventListener("keydown",function(e){
  if(e.altKey && e.key==="ArrowLeft"){goBack();}
  if(e.key==="Backspace" && document.activeElement.tagName!=="INPUT"){goBack();}
});
</script>

</body>
</html>
